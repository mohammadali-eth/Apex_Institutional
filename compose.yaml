# ==============================================================================
# Question Paper Management System (QPMS) — Compose Specification
# ==============================================================================
name: qpms

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: qpms_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-qpms_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qpms_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - qpms_network

  # ----------------------------------------------------------------------------
  # Backend API Service (Optional containerized execution)
  # For local host development, run: uvicorn app.main:create_application --reload
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qpms_backend_dev
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-qpms_dev}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - qpms_network
    profiles:
      - full-stack

volumes:
  postgres_data:
    name: qpms_postgres_data
    driver: local

networks:
  qpms_network:
    name: qpms_network
    driver: bridge
